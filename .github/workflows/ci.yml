name: Offline validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.0'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - run: python -m venv .venv && .venv/bin/python -m pip install -r python/requirements-import.txt
      - run: sudo apt-get update && sudo apt-get install -y antiword
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run review:preview
      - run: npm run benchmark:crm:preview
      - run: npm run compare:preview
      - run: npm run bench:preview
      - run: python3 -m py_compile python/laya_worker.py python/import_requirements.py
