name: Offline validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run review:preview
      - run: npm run benchmark:crm:preview
      - run: npm run compare:preview
      - run: npm run bench:preview
      - run: python3 -m py_compile python/laya_worker.py
