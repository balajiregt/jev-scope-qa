# Optional legacy adapter. Copy to harness.local.yml and configure your own paths.
repository_topology:
  evaluation_layer: standalone-node-typescript
  existing_harness: ../your-playwright-project
  mode: read-only-evidence-adapter
credential_file: .env.local
evidence:
  crm_tests: tests/sample-crm.spec.ts
  crm_assertions: assertions/sample-crm.assertions.ts
  crm_pages: pages/sample-crm.page.ts
next_step_commands:
  typecheck: npm run typecheck
  focused_playwright: APP_BASE_URL=http://127.0.0.1:4173 npm run sample:crm:test
